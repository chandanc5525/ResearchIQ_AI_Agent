[project]
name = "researchiq-ai-agent"
version = "0.1.0"
description = "Local-first agentic RAG research intelligence platform built with Streamlit, LangGraph, ChromaDB and Ollama."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ResearchIQ" }]
keywords = [
    "rag",
    "langgraph",
    "streamlit",
    "chromadb",
    "ollama",
    "research",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
]

[project.scripts]
researchiq = "main:main"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "embeddings",
    "evaluation",
    "generation",
    "ingestion",
    "prompts",
    "retrieval",
    "ui",
    "utils",
    "workflows",
]
include = ["services.py", "main.py"]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
    \.venv
  | vectorstore
  | data
  | \.streamlit
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = [
    "agents",
    "embeddings",
    "evaluation",
    "generation",
    "ingestion",
    "prompts",
    "retrieval",
    "services",
    "ui",
    "utils",
    "workflows",
]
skip_glob = [".venv/*", "vectorstore/*", "data/*", ".streamlit/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require downloaded models, Ollama, or other local services",
]
filterwarnings = [
    "ignore::DeprecationWarning:langchain_community.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["agents", "embeddings", "evaluation", "generation", "ingestion", "prompts", "retrieval", "ui", "utils", "workflows", "services"]
omit = ["tests/*", "ui/streamlit_app.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
